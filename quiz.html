<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>塑膠材料知識闖關測驗</title>

  <style>
    body {
      font-family: "Microsoft JhengHei", sans-serif;
      background-color: #eef7f0;
      text-align: center;
      padding: 30px 15px;
    }

    .quiz-container {
      max-width: 700px;
      margin: 30px auto;
      padding: 30px;
      background-color: white;
      border-radius: 15px;
      box-shadow: 0 2px 10px #cccccc;
    }

    h1 {
      color: #287a45;
    }

    p {
      font-size: 18px;
      line-height: 1.8;
    }

    .home-button {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 25px;
      background-color: #398653;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-size: 18px;
    }

    .home-button:hover {
      background-color: #24663a;
    }
  </style>
</head>

<body>

  <div class="quiz-container"> 

    <!-- 歡迎畫面 -->
    <div id="welcome-screen">
    <h1>塑膠材料知識闖關測驗</h1>

    <p>歡迎來到塑膠材料知識測驗！</p>

    <p>認識常見的七種塑膠材料後，</p>
    <p>來測試一下自己的學習成果吧！</p>

    <p>本測驗共五題，不計分，</p>
    <p>每題作答後都會顯示正確答案與材料說明。</p>

    <button id="start-button">開始測驗</button>  

    <br><br>  
    <a href="index.html" class="home-button">
      返回首頁
    </a>
  </div>

 <!-- 測驗畫面 -->
  <div id="question-screen" style="display:none;">

    <h2 id="question-number">第 1 題 / 共 5 題</h2>

    <p id="question-text">請問下列哪一項是正確答案？</p>

    <div id="options-container">
      <!-- 四個選項將由 JavaScript 自動產生 -->
    </div>

    <div id="answer-feedback"></div>
    <button id="next-button" style="display:none;">
     下一題
    </button>
  </div>

</div> 
    
  <script>
async function loadPlasticData() {

  // 讀取 SVG 檔案
  const response = await fetch("常見塑膠材質編號1.svg");

  if (!response.ok) {
    throw new Error("無法讀取 SVG 檔案");
  }

  const svgText = await response.text();

  // 將 SVG 文字轉換成可讀取的文件
  const parser = new DOMParser();
  const svgDoc = parser.parseFromString(svgText, "image/svg+xml");

  // 建立材料資料陣列
  const plastics = [];

  const items = svgDoc.querySelectorAll("a");

  // 材料名稱與塑膠編號對照表
  const numberMap = {
    "聚對苯二甲酸乙二酯": 1,
    "高密度聚乙烯": 2,
    "聚氯乙烯": 3,
    "低密度聚乙烯": 4,
    "聚丙烯": 5,
    "聚苯乙烯": 6,
    "其他": 7
  };

  items.forEach(item => {

    const desc = item.querySelector("desc");
    const textElement = item.querySelector("text");

    const name = textElement?.textContent
      ?.replace(/[\s\u3000]+/g, "").trim();

    if (desc && name) {

      const number = numberMap[name];

      if (number !== undefined) {
        plastics.push({
          number: number,
          name: name,
          description: String(desc.textContent || "").trim()
        });
      }
    }
  });

  console.log("塑膠材料資料：", plastics);
  console.log("材料總數：", plastics.length);

  // 確認至少有七種材料
  if (plastics.length < 7) {
    alert("SVG 材料資料不足，請檢查 SVG 檔案。");
    return;
  }

  // 隨機打亂陣列的共用函數
  function shuffle(array) {

    for (let i = array.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));

      [array[i], array[j]] = [array[j], array[i]];
    }

    return array;
  }

  // 隨機抽出五種材料，不重複
  const selectedPlastics = shuffle([...plastics]).slice(0, 5);

  console.log("本次隨機抽出的五題：", selectedPlastics);

  // 目前題目索引，從 0 開始
  let currentIndex = 0;

  // 取得網頁上的元素
  const startButton = document.getElementById("start-button");
  const nextButton = document.getElementById("next-button");
  const container = document.getElementById("options-container");
  const feedback = document.getElementById("answer-feedback");

  // 顯示指定題目
  function showQuestion() {

    const currentQuestion = selectedPlastics[currentIndex];

    // 顯示題目編號
    document.getElementById("question-number").textContent =
      "第 " + (currentIndex + 1) + " 題 / 共 5 題";

    // 顯示題目
    document.getElementById("question-text").textContent =
      "塑膠回收標誌編號 " +
      currentQuestion.number +
      " 代表哪一種材料？";

    // 清除上一題的內容
    feedback.textContent = "";
    container.textContent = "";

    // 隱藏下一題按鈕
    nextButton.style.display = "none";
    nextButton.textContent = "下一題";

    // 找出其他六種材料
    const otherOptions = plastics.filter(
      plastic => plastic.number !== currentQuestion.number
    );

    // 隨機抽取三個干擾選項
    shuffle(otherOptions);

    // 正確答案加上三個干擾選項
    const options = [
      currentQuestion,
      ...otherOptions.slice(0, 3)
    ];

    // 將四個選項隨機排列
    shuffle(options);

    // 建立四個選項按鈕
    options.forEach((option, index) => {

      const button = document.createElement("button");

      button.textContent =
        String.fromCharCode(65 + index) + ". " + option.name;

      // 點選選項後判斷答案
      button.addEventListener("click", function() {

        if (option.number === currentQuestion.number) {
          feedback.textContent = "答對了！";
        } else {
          feedback.textContent = "答錯了！";
        }

        // 顯示正確答案
        feedback.textContent +=
          "\n正確答案：" + currentQuestion.name;

        // 顯示材料說明
        feedback.textContent +=
          "\n材料說明：" + currentQuestion.description;

        // 鎖定所有選項
        container.querySelectorAll("button").forEach(btn => {
          btn.disabled = true;
        });

        // 顯示下一題按鈕
        nextButton.style.display = "block";

        // 第五題改成完成測驗
        if (currentIndex === 4) {
          nextButton.textContent = "完成測驗";
        }

      });

      container.appendChild(button);

    });

    // 顯示本題資料
    console.log("第 " + (currentIndex + 1) + " 題");
    console.log("正確答案：", currentQuestion.name);
    console.log("四個選項：", options);
  }

  // 按下開始測驗
  startButton.addEventListener("click", function() {

    document.getElementById("welcome-screen").style.display = "none";

    document.getElementById("question-screen").style.display = "block";

    currentIndex = 0;

    showQuestion();

  });

  // 按下下一題或完成測驗
  nextButton.addEventListener("click", function() {

    if (currentIndex < 4) {

      // 進入下一題
      currentIndex++;

      showQuestion();

    } else {

      // 五題全部完成
      document.getElementById("question-number").textContent =
        "測驗完成";

      document.getElementById("question-text").textContent =
        "恭喜您完成五題測驗！";

      container.textContent = "";
      feedback.textContent = "";

      nextButton.style.display = "none";

      // 建立返回首頁連結
      const homeLink = document.createElement("a");

      homeLink.href = "index.html";
      homeLink.textContent = "返回首頁";
      homeLink.className = "home-button";

      document.getElementById("question-screen").appendChild(homeLink);

    }

  });

}

// 網頁載入後執行
loadPlasticData().catch(error => {
  console.error("測驗資料載入失敗：", error);
  alert("測驗資料載入失敗，請檢查 SVG 檔案及網頁伺服器。");
});

</script>
  
</body>
</html>
