<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>塑膠材料知識闖關測驗</title>

  <style>
    body {
      font-family: "Microsoft JhengHei", sans-serif;
      background-color: #eef7f0;
      text-align: center;
      padding: 30px 15px;
    }

    .quiz-container {
      max-width: 700px;
      margin: 30px auto;
      padding: 30px;
      background-color: white;
      border-radius: 15px;
      box-shadow: 0 2px 10px #cccccc;
    }

    h1 {
      color: #287a45;
    }

    p {
      font-size: 18px;
      line-height: 1.8;
    }

    .home-button {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 25px;
      background-color: #398653;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-size: 18px;
    }

    .home-button:hover {
      background-color: #24663a;
    }
  </style>
</head>

<body>

  <div class="quiz-container"> 

    <!-- 歡迎畫面 -->
    <div id="welcome-screen">
    <h1>塑膠材料知識闖關測驗</h1>

    <p>歡迎來到塑膠材料知識測驗！</p>

    <p>認識常見的七種塑膠材料後，</p>
    <p>來測試一下自己的學習成果吧！</p>

    <p>本測驗共五題，不計分，</p>
    <p>每題作答後都會顯示正確答案與材料說明。</p>

    <button id="start-button">開始測驗</button>  

    <br><br>  
    <a href="index.html" class="home-button">
      返回首頁
    </a>
  </div>

 <!-- 測驗畫面 -->
  <div id="question-screen" style="display:none;">

    <h2 id="question-number">第 1 題 / 共 5 題</h2>

    <p id="question-text">請問下列哪一項是正確答案？</p>

    <div id="options-container">
      <!-- 四個選項將由 JavaScript 自動產生 -->
    </div>

    <div id="answer-feedback"></div>

  </div>

</div> 
    
  <script>
  async function loadPlasticData() {

    // 讀取 SVG 檔案
    const response = await fetch("常見塑膠材質編號1.svg");
    const svgText = await response.text();

    // 將 SVG 文字轉換成可讀取的文件
    const parser = new DOMParser();
    const svgDoc = parser.parseFromString(svgText, "image/svg+xml");

    // 建立材料資料陣列
    const plastics = [];

    // 找出所有含有 desc 說明的連結物件
    const items = svgDoc.querySelectorAll("a");
    // 材料名稱與塑膠編號對照表
    const numberMap = {
      "聚對苯二甲酸乙二酯": 1,
      "高密度聚乙烯": 2,
      "聚氯乙烯": 3,
      "低密度聚乙烯": 4,
      "聚丙烯": 5,
      "聚苯乙烯": 6,
      "其他": 7
    };
    
    items.forEach(item => {
      const desc = item.querySelector("desc");

      const textElement = item.querySelector("text");
      const name = textElement?.textContent?.replace(/[\s\u3000]+/g, "").trim();
      
      if (desc && name) {

        // 依照材料名稱取得真正的塑膠編號
        const number = numberMap[name];
        console.log("清理後的名稱：", JSON.stringify(name));
        console.log("取得的編號：", number);
        
        plastics.push({
          number: number,
          name: name,
          description: String(desc.textContent || "").trim()
        });

      } else {
        console.log("略過沒有材料名稱的物件：", item);
      }
  });
    
    // 顯示整理後的材料資料
    console.log("塑膠材料資料：", plastics);
    plastics.forEach((item, index) => {
      console.log("Array[" + index + "]，塑膠材料編號：" + item.number +
    "，材料名稱：" + item.name);
    });
    console.log("材料總數：", plastics.length);
    // 隨機打亂七種材料的順序
    const shuffled = [...plastics];

    for (let i = shuffled.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));

      [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
    }

    // 取出前五種，作為本次測驗題目
    const selectedPlastics = shuffled.slice(0, 5);

    // 顯示本次抽出的五種材料
    console.log("本次隨機抽出的五題：", selectedPlastics);
    
    // 按下開始測驗按鈕
const startButton = document.getElementById("start-button");

startButton.addEventListener("click", function() {

  // 隱藏歡迎畫面
  document.getElementById("welcome-screen").style.display = "none";

  // 顯示測驗畫面
  document.getElementById("question-screen").style.display = "block";

  // 顯示第一題題目
  document.getElementById("question-number").textContent = "第 1 題 / 共 5 題";

  document.getElementById("question-text").textContent =
    "塑膠回收標誌編號 " + selectedPlastics[0].number +
    " 代表哪一種材料？";

});

  selectedPlastics.forEach((item, index) => {

  // 找出其他六種材料（排除正確答案）
  const otherOptions = plastics.filter(
    plastic => plastic.number !== item.number
  );

  // 正確答案加上三個干擾選項
  const options = [
    item,
    ...otherOptions.slice(0, 3)
  ];

  // 將四個選項隨機排列
  for (let i = options.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));

    [options[i], options[j]] = [options[j], options[i]];
  }

  // 顯示測試結果
  console.log("第 " + (index + 1) + " 題");
  console.log("正確答案：", item.name);
  console.log("四個選項：");

  options.forEach((option, optionIndex) => {
    console.log(
      String.fromCharCode(65 + optionIndex) + ". " +
      option.name
    );
  });

 });
 }

// 網頁載入後執行
loadPlasticData();
</script>
  
</body>
</html>
