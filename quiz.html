<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>塑膠材料知識闖關測驗</title>

  <style>
    body {
      font-family: "Microsoft JhengHei", sans-serif;
      background-color: #eef7f0;
      text-align: center;
      padding: 30px 15px;
    }

    .quiz-container {
      max-width: 700px;
      margin: 30px auto;
      padding: 30px;
      background-color: white;
      border-radius: 15px;
      box-shadow: 0 2px 10px #cccccc;
    }

    h1 { color: #287a45; }

    p {
      font-size: 18px;
      line-height: 1.8;
    }

    button {
      margin: 8px;
      padding: 10px 18px;
      font-size: 17px;
      cursor: pointer;
    }

    button:disabled {
      cursor: default;
    }

    #question-text {
      white-space: pre-line;
    }

    #product-image-container {
      margin: 12px auto;
      min-height: 10px;
    }

    #product-image-container img {
      display: block;
      max-width: 100%;
      max-height: 300px;
      width: auto;
      height: auto;
      margin: 0 auto;
      object-fit: contain;
    }

    #options-container button {
      display: block;
      width: 90%;
      max-width: 560px;
      margin: 10px auto;
      padding: 12px;
      text-align: left;
      border: 1px solid #9ab9a2;
      border-radius: 8px;
      background: #f7fbf7;
    }

    #options-container button:hover:not(:disabled) {
      background: #e2f2e5;
    }

    #answer-feedback {
      white-space: pre-line;
      text-align: left;
      line-height: 1.8;
      margin: 18px auto;
      max-width: 600px;
      font-size: 17px;
    }

    .home-button {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 25px;
      background-color: #398653;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-size: 18px;
    }

    .home-button:hover {
      background-color: #24663a;
    }
  </style>
</head>

<body>
  <div class="quiz-container">

    <!-- 測驗階段選擇畫面 -->
    <div id="welcome-screen">
      <h1>塑膠材料知識闖關測驗</h1>
      <p>歡迎來到塑膠材料知識測驗！</p>
      <p>請選擇想挑戰的測驗階段。</p>

      <button id="start-button">第一階段：認識七種塑膠材料</button>
      <br>
      <button id="second-phase-button">第二階段：生活用品材質挑戰</button>

      <br><br>
      <a href="index.html" class="home-button">返回首頁</a>
    </div>

    <!-- 第二階段題型選擇畫面 -->
    <div id="mode-screen" style="display:none;">
      <h1>第二階段：生活用品材質挑戰</h1>
      <p>請選擇挑戰方式。</p>

      <button id="mode-a-button">A 型：單項產品判斷</button>
      <p>看一項日常用品，選出正確的材質編號與英文簡稱。</p>

      <button id="mode-c-button">C 型：四項產品組合</button>
      <p>看四項日常用品，選出正確的材質組合順序。</p>

      <button id="back-button">返回測驗階段選擇</button>
    </div>

    <!-- 共用測驗畫面 -->
    <div id="question-screen" style="display:none;">
      <h2 id="question-number">第 1 題 / 共 10 題</h2>
      <div id="product-image-container"></div>
      <p id="question-text">請選擇正確答案。</p>

      <div id="options-container">
        <!-- 四個選項由 JavaScript 自動產生 -->
      </div>

      <div id="answer-feedback"></div>
      <button id="next-button" style="display:none;">下一題</button>
    </div>

  </div>

  <script>
    async function loadPlasticData() {

      // 讀取 SVG 檔案
      const response = await fetch("常見塑膠材質編號1.svg");

      if (!response.ok) {
        throw new Error("無法讀取 SVG 檔案");
      }

      const svgText = await response.text();

      // 將 SVG 文字轉換成可讀取的文件
      const parser = new DOMParser();
      const svgDoc = parser.parseFromString(svgText, "image/svg+xml");

      // --------------------------------------------------
      // 第一階段：讀取七種塑膠材料
      // --------------------------------------------------
      const plastics = [];
      const items = svgDoc.querySelectorAll("a");

      const numberMap = {
        "聚對苯二甲酸乙二酯": 1,
        "高密度聚乙烯": 2,
        "聚氯乙烯": 3,
        "低密度聚乙烯": 4,
        "聚丙烯": 5,
        "聚苯乙烯": 6,
        "其他(多類型材料)": 7
      };

      items.forEach(item => {
        const desc = item.querySelector("desc");
        const textElement = item.querySelector("text");

        const name = textElement?.textContent
          ?.replace(/[\s\u3000]+/g, "").trim();

        if (desc && name) {
          const number = numberMap[name];

          if (number !== undefined) {
            plastics.push({
              number: number,
              name: name,
              description: String(desc.textContent || "").trim()
            });
          }
        }
      });

      console.log("七種塑膠材料資料：", plastics);

      if (plastics.length < 7) {
        alert("SVG 材料資料不足，請檢查 SVG 檔案。");
        return;
      }

      // --------------------------------------------------
      // 第二階段：讀取 daily-products 裡的日常用品
      // --------------------------------------------------
      const products = [];
      const dailyProducts = svgDoc.querySelector("#daily-products");

      if (dailyProducts) {
        // 只讀取 daily-products 之下第一層的產品群組
        Array.from(dailyProducts.children).forEach(group => {
          if (group.tagName.toLowerCase() !== "g") return;

          const textElement = group.querySelector(":scope > text");
          const descElement = group.querySelector(":scope > desc");

          const name = textElement?.textContent?.trim();
          const description = descElement?.textContent?.trim();

          if (!name || !description) return;

          // 從例如「常見編號／材質：2 (HDPE)」取出 2 與 HDPE
          const match = description.match(/(\d+)\s*\(\s*([A-Za-z]+)\s*\)/);

          if (match) {
            products.push({
              id: group.getAttribute("id") || "",
              name: name,
              number: Number(match[1]),
              material: match[2].toUpperCase(),
              description: description
            });
          }
        });
      }

      console.log("日常用品資料：", products);
      console.log("日常用品總數：", products.length);

      if (products.length < 4) {
        console.warn("日常用品資料不足，請確認 SVG 的 daily-products 區段。");
      }

      // 隨機打亂陣列
      function shuffle(array) {
        for (let i = array.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
      }

      // 取得網頁元素
      const welcomeScreen = document.getElementById("welcome-screen");
      const modeScreen = document.getElementById("mode-screen");
      const questionScreen = document.getElementById("question-screen");
      const startButton = document.getElementById("start-button");
      const secondPhaseButton = document.getElementById("second-phase-button");
      const modeAButton = document.getElementById("mode-a-button");
      const modeCButton = document.getElementById("mode-c-button");
      const backButton = document.getElementById("back-button");
      const nextButton = document.getElementById("next-button");
      const container = document.getElementById("options-container");
      const feedback = document.getElementById("answer-feedback");
      const questionNumber = document.getElementById("question-number");
      const questionText = document.getElementById("question-text");
      const productImageContainer = document.getElementById("product-image-container");

      // 目前已經放入 images 資料夾的產品圖片
      // 之後增加圖片時，只要在這裡繼續新增產品名稱與檔案路徑即可。
      const productImageMap = {
        "寶特瓶飲用水": "images/Drinking_water.png",
        "寶特瓶汽水"  : "images/Soft_drink.png",
        "瓶裝鮮奶"    : "images/Fresh_milk.png",
        "瓶裝豆漿"    : "images/Soy_milk.png",
        "4L桶裝酒精"  : "images/4L_Alcohol.png",
        "洗髮乳"      : "images/Shampoo.png",
        "雨衣"        : "images/raincoat.png",
        "PVC保鮮膜"   : "images/PVC_wrap.png",
        "玩具公仔"    : "images/Toy_figures.png",
        "PE保鮮膜"    : "images/PE_wrap.png",
        "塑膠袋"      : "images/Plastic_bag.png",
        "夾鏈袋"      : "images/Ziplock_bag.png",
        "擠壓瓶"      : "images/Squeeze_bottle.png",
        "可微波餐具"  : "images/Microwave-safe_ware.png",
        "500ml瓶裝酒精": "images/500ml_Alcohol.png",   
        "可微波餐品"  : "images/Microwavable_meals.png",
        "養樂多"      : "images/Yakult.png",    
        "一次性杯子"  : "images/Disposable_cup.png",
        "一次性刀叉"  : "images/Disposable_cutlery.png",
        "電腦滑鼠鍵盤": "images/Computer_mouseKeyboard.png",
        "20L桶裝水"   : "images/Large-container_water.png",
        "奶瓶"        : "images/Baby_bottle.png",
        "美耐皿餐具"  : "images/Melamine.png",
        "益敏優多"    : "images/lp33.png"
      };

      let currentIndex = 0;
      let quizMode = "phase1";
      let selectedQuestions = [];

      // 顯示共用題目畫面
      function prepareQuestionScreen() {
        welcomeScreen.style.display = "none";
        modeScreen.style.display = "none";
        questionScreen.style.display = "block";
        currentIndex = 0;
        showQuestion();
      }

      // --------------------------------------------------
      // 第一階段：材料名稱測驗
      // --------------------------------------------------
      function startPhaseOne() {
        quizMode = "phase1";
        selectedQuestions = shuffle([...plastics]).slice(0, 5);
        prepareQuestionScreen();
      }

      // --------------------------------------------------
      // 第二階段 A 型：單項產品判斷
      // --------------------------------------------------
      function startModeA() {
        quizMode = "modeA";
        selectedQuestions = shuffle([...products]).slice(0, 10);
        prepareQuestionScreen();
      }

      // --------------------------------------------------
      // 第二階段 C 型：四項產品材質組合
      // --------------------------------------------------
      function startModeC() {
        quizMode = "modeC";

        // 每一題隨機抽出四項不同產品
        selectedQuestions = Array.from({ length: 10 }, () =>
          shuffle([...products]).slice(0, 4)
        );

        prepareQuestionScreen();
      }

      // C 型：產生正確組合與三個不同的干擾組合
      function makeCombinationOptions(questionProducts) {
        const correct = questionProducts.map(
          product => product.number + "-" + product.material
        );

        const correctText = correct.join("、");
        const options = [correctText];
        const materialChoices = plastics.map(
          plastic => plastic.number + "-" + (
            plastic.number === 1 ? "PET" :
            plastic.number === 2 ? "HDPE" :
            plastic.number === 3 ? "PVC" :
            plastic.number === 4 ? "LDPE" :
            plastic.number === 5 ? "PP" :
            plastic.number === 6 ? "PS" : "OTHER"
          )
        );

        // 每次改變組合中的一個位置，產生不同的干擾答案
        let attempts = 0;
        while (options.length < 4 && attempts < 100) {
          attempts++;

          const wrong = [...correct];
          const position = Math.floor(Math.random() * wrong.length);
          const alternatives = materialChoices.filter(
            item => item !== wrong[position]
          );

          wrong[position] = alternatives[
            Math.floor(Math.random() * alternatives.length)
          ];

          const wrongText = wrong.join("、");

          if (!options.includes(wrongText)) {
            options.push(wrongText);
          }
        }

        // 若仍不足四個不同選項，再以隨機組合補足
        while (options.length < 4) {
          const wrong = questionProducts.map(() =>
            materialChoices[Math.floor(Math.random() * materialChoices.length)]
          );
          const wrongText = wrong.join("、");
          if (!options.includes(wrongText)) {
            options.push(wrongText);
          }
        }

        return shuffle(options).map((text, index) => ({
          text: text,
          isCorrect: text === correctText,
          label: String.fromCharCode(65 + index)
        }));
      }

      // 顯示指定題目
      function showQuestion() {
        const question = selectedQuestions[currentIndex];

        questionNumber.textContent =
          "第 " + (currentIndex + 1) + " 題 / 共 10 題";

        feedback.textContent = "";
        container.textContent = "";
        productImageContainer.textContent = "";
        nextButton.style.display = "none";
        nextButton.textContent = "下一題";

        let options = [];
        let correctAnswer = "";
        let feedbackText = "";

        if (quizMode === "phase1") {
          questionText.textContent =
            "塑膠回收標誌編號 " + question.number + " 代表哪一種材料？";

          const otherOptions = plastics.filter(
            plastic => plastic.number !== question.number
          );

          options = shuffle([
            question,
            ...shuffle(otherOptions).slice(0, 3)
          ]);

          correctAnswer = question.name;
          feedbackText =
            "正確答案：" + question.name +
            "\n材料說明：" + question.description;

          options = options.map(option => ({
            text: option.name,
            isCorrect: option.number === question.number
          }));

        } else if (quizMode === "modeA") {
          const imagePath = productImageMap[question.name];

          if (imagePath) {
            // 有圖片的產品：顯示圖片，不顯示產品名稱
            const image = document.createElement("img");
            image.src = imagePath;
            image.alt = "請辨識圖片中的日常用品";
            image.onerror = function() {
              productImageContainer.textContent = "圖片讀取失敗，請確認 images 資料夾及檔名。";
            };
            productImageContainer.appendChild(image);

            questionText.textContent =
              "請看圖片，選出這項產品常見的塑膠材質編號與英文簡稱。";
          } else {
            // 尚未準備圖片的產品：暫時以名稱出題，避免出現空白題目
            questionText.textContent =
              "（此產品圖片尚未加入）\n請問「" + question.name +
              "」常見的塑膠材質編號與英文簡稱是？";
          }

          const correct = question.number + "-" + question.material;
          const materialChoices = [
            "1-PET", "2-HDPE", "3-PVC", "4-LDPE",
            "5-PP", "6-PS", "7-OTHER"
          ];

          options = shuffle([
            correct,
            ...shuffle(materialChoices.filter(item => item !== correct)).slice(0, 3)
          ]).map(text => ({
            text: text,
            isCorrect: text === correct
          }));

          correctAnswer = correct;
          feedbackText =
            "產品：" + question.name +
            "\n正確答案：" + correct +
            "\nSVG 資料：" + question.description;

        } else if (quizMode === "modeC") {
          questionText.textContent =
            "請依照下列四項產品的順序，選出正確的材質編號與英文簡稱：\n" +
            question.map((product, index) =>
              (index + 1) + ". " + product.name
            ).join("\n");

          options = makeCombinationOptions(question);

          correctAnswer = question.map(product =>
            product.number + "-" + product.material
          ).join("、");

          feedbackText =
            "正確材質組合：" + correctAnswer +
            "\n產品對照：" +
            question.map((product, index) =>
              "\n" + (index + 1) + ". " + product.name +
              " → " + product.number + "-" + product.material
            ).join("");
        }

        // 建立四個答案按鈕
        options.forEach((option, index) => {
          const button = document.createElement("button");
          button.textContent =
            String.fromCharCode(65 + index) + ". " + option.text;

          button.addEventListener("click", function() {
            if (option.isCorrect) {
              feedback.textContent = "答對了！\n" + feedbackText;
            } else {
              feedback.textContent = "答錯了！\n" + feedbackText;
            }

            // 鎖定所有選項
            container.querySelectorAll("button").forEach(btn => {
              btn.disabled = true;
            });

            nextButton.style.display = "inline-block";

            if (currentIndex === 9) {
              nextButton.textContent = "完成測驗";
            }
          });

          container.appendChild(button);
        });

        console.log("目前測驗模式：", quizMode);
        console.log("第 " + (currentIndex + 1) + " 題資料：", question);
        console.log("本題選項：", options);
      }

      // 第一階段按鈕
      startButton.addEventListener("click", startPhaseOne);

      // 第二階段按鈕
      secondPhaseButton.addEventListener("click", function() {
        welcomeScreen.style.display = "none";
        modeScreen.style.display = "block";
      });

      // 第二階段 A、C 型按鈕
      modeAButton.addEventListener("click", function() {
        if (products.length < 5) {
          alert("日常用品資料不足，至少需要五項產品。");
          return;
        }
        startModeA();
      });

      modeCButton.addEventListener("click", function() {
        if (products.length < 4) {
          alert("日常用品資料不足，至少需要四項產品。");
          return;
        }
        startModeC();
      });

      // 返回階段選擇
      backButton.addEventListener("click", function() {
        modeScreen.style.display = "none";
        welcomeScreen.style.display = "block";
      });

      // 下一題或完成測驗
      nextButton.addEventListener("click", function() {
        if (currentIndex < 9) {
          currentIndex++;
          showQuestion();
        } else {
          questionNumber.textContent = "測驗完成";
          questionText.textContent = "恭喜您完成本階段十題測驗！";
          container.textContent = "";
          feedback.textContent = "";
          nextButton.style.display = "none";

          const homeLink = document.createElement("a");
          homeLink.href = "index.html";
          homeLink.textContent = "返回首頁";
          homeLink.className = "home-button";

          const retryButton = document.createElement("button");
          retryButton.textContent = "重新選擇測驗";
          retryButton.addEventListener("click", function() {
            questionScreen.style.display = "none";
            welcomeScreen.style.display = "block";
            homeLink.remove();
            retryButton.remove();
          });

          questionScreen.appendChild(retryButton);
          questionScreen.appendChild(homeLink);
        }
      });
    }

    // 網頁載入後執行
    loadPlasticData().catch(error => {
      console.error("測驗資料載入失敗：", error);
      alert("測驗資料載入失敗，請檢查 SVG 檔案及網頁伺服器。");
    });
  </script>
</body>
</html>
